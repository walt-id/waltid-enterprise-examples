name: postgres-vault-${DEMO_MODE:-static}

services:
  postgres:
    image: postgres:18
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export VAULT_DB_PASSWORD="$$(cat /run/secrets/vault-db-password)"
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: waltid_enterprise
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    secrets: [postgres-password, vault-db-password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "waltid_enterprise"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:1.19.3
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        export VAULT_DEV_ROOT_TOKEN_ID="$$(cat /run/secrets/vault-root-token)"
        exec vault server -dev -dev-no-store-token -dev-listen-address=0.0.0.0:8200 >/tmp/vault-server.log 2>&1
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    secrets: [vault-root-token]
    volumes:
      - vault-operator-auth:/run/vault-operator:ro
    ports:
      - "127.0.0.1:${DEMO_VAULT_PORT:-18200}:8200"
      - "127.0.0.1:${DEMO_API_PORT:-17500}:3000"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault-init:
    image: hashicorp/vault:1.19.3
    user: "0:0"
    entrypoint: ["/bin/sh", "/demo/init-vault.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      DEMO_MODE: ${DEMO_MODE:-static}
    secrets: [vault-root-token, vault-db-password]
    volumes:
      - ./init-vault.sh:/demo/init-vault.sh:ro
      - vault-app-auth:/run/vault
      - vault-operator-auth:/run/vault-operator
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  api:
    image: eclipse-temurin:21-jre
    user: "0:0"
    network_mode: service:vault
    working_dir: /demo/waltid-enterprise-api
    command: ["/opt/enterprise/bin/waltid-enterprise-api-development"]
    environment:
      DEMO_API_PORT: ${DEMO_API_PORT:-17500}
      JAVA_TOOL_OPTIONS: >-
        -Dconfig.file.database=/demo/config/database.conf
        -Dconfig.file.enterprise=/demo/config/enterprise.conf
    volumes:
      - ${ENTERPRISE_DIST_DIR:-${ENTERPRISE_SOURCE_DIR:?set ENTERPRISE_SOURCE_DIR}/waltid-enterprise-api-development/build/install/waltid-enterprise-api-development}:/opt/enterprise:ro
      - ${ENTERPRISE_SOURCE_DIR:?set ENTERPRISE_SOURCE_DIR}/waltid-enterprise-api/config:/demo/waltid-enterprise-api/config:ro
      - ./config/database-${DEMO_MODE:-static}.conf:/demo/config/database.conf:ro
      - ./config/enterprise.conf:/demo/config/enterprise.conf:ro
      - ${DEMO_STATE_DIR:-./artifacts/${DEMO_MODE:-static}}/dev-license:/demo/dev-license:ro
      - vault-app-auth:/run/vault:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully

secrets:
  postgres-password:
    file: ${DEMO_STATE_DIR:-./artifacts/${DEMO_MODE:-static}}/postgres-password
  vault-db-password:
    file: ${DEMO_STATE_DIR:-./artifacts/${DEMO_MODE:-static}}/vault-db-password
  vault-root-token:
    file: ${DEMO_STATE_DIR:-./artifacts/${DEMO_MODE:-static}}/vault-root-token

volumes:
  postgres-data:
  vault-app-auth:
  vault-operator-auth:

databaseType = postgresql
postgresql {
    connectionString = "jdbc:postgresql://postgres:5432/waltid_enterprise?ApplicationName=enterprise-vault-demo"
    schema = "waltid"
    pool { maxSize = 8, minIdle = 2, connectionTimeoutMs = 4000 }
    vault {
        address = "http://127.0.0.1:8200"
        databaseMount = "database"
        role = "waltid-static"
        roleType = STATIC
        tokenFile = "/run/vault/app-token"
        staticPollIntervalSeconds = 2
    }
}

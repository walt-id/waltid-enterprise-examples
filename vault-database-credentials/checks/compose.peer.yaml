services:
  vault:
    ports:
      - "127.0.0.1:${DEMO_PEER_API_PORT:?set a peer port}:3001"

  api-peer:
    extends:
      file: ${DEMO_BASE_COMPOSE:?set the database demo Compose file}
      service: api
    environment:
      DEMO_API_PORT: ${DEMO_PEER_API_PORT:?set a peer port}
      JAVA_TOOL_OPTIONS: >-
        -Dconfig.file.database=/demo/config/database.conf
        -Dconfig.file.enterprise=/demo/config/enterprise.conf
        -Dconfig.file.web=/demo/config/peer-web.conf
    volumes:
      - ../checks/peer-web.conf:/demo/config/peer-web.conf:ro

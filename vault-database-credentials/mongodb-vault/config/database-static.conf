databaseType = mongodb
mongodb {
    connectionString = "mongodb://mongo:27017/?replicaSet=rs0&appName=enterprise-mongodb-vault-demo"
    database = "waltid-enterprise"
    profile = MONGODB_8
    pool { maxSize = 8, minSize = 2, maxWaitTimeMs = 5000 }
    vault {
        address = "http://127.0.0.1:8200"
        databaseMount = "database"
        role = "waltid-static"
        roleType = STATIC
        tokenFile = "/run/vault/app-token"
        authSource = "admin"
        staticPollIntervalSeconds = 2
    }
}
